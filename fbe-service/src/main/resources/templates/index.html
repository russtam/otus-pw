<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
</head>
<body>
<center>
    <h1>ИНТЕРНЕТ МАГАЗИН</h1>
    <br/>
    <table width="60%" align="center">
        <tr>
            <th><a href="/profile">Профиль</a></th>
            <th><a href="/cart">Корзина</a></th>
            <th><a href="/orders">Заказы</a></th>
            <th><a href="/logout">Выход</a></th>
        </tr>
    </table>
    <br/>
    <h2>Каталог</h2>
    <br/>

    <table style="border-spacing: 16px;">
        <tr th:each="product : ${products}" th:object="${product}">
            <td><img th:src="*{imageUrl}" alt=""/></td>
            <td>
                <h3 th:text="*{name}"></h3><br/>
                Доступно: <span th:text="*{available}"></span><br/>
                Зарезервировано:  <span th:text="*{reserved}"></span>
            </td>
            <td><p class="price">[[*{price}]] ₽</p></td>
            <td>
                <button class="add-to-cart" th:onclick="'addToCart(' + ${product.id} + ',' + ${product.price} + ');'">В корзину</button>
            </td>
        </tr>
    </table>
</center>

<script th:src="@{/js/app.js}" type="text/javascript"></script>
</body>
</html>
