<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
</head>
<body>
<center>
    <h1>ИНТЕРНЕТ МАГАЗИН</h1>
    <br/>
    <table width="60%" align="center">
        <tr>
            <th><a href="/index">Каталог</a></th>
            <th><a href="/profile">Профиль</a></th>
            <th><a href="/cart">Корзина</a></th>
            <th><a href="/logout">Выход</a></th>
        </tr>
    </table>
    <br/>
    <h2>Заказы</h2>
    <br/>

    <table style="border-spacing: 16px;">
        <tr>
            <th>Дата и время заказа</th>
            <th>Номер заказа</th>
            <th>Сумма заказа</th>
            <th>Статус</th>
            <th></th>
        </tr>
        <tr th:each="order : ${orders}" th:object="${order}">
            <td><p th:text="*{#temporals.format(created, 'yyyy-MM-dd HH:mm:ss')}"></p></td>
            <td><p th:text="*{orderId}"></p></td>
            <td><p class="price">[[*{amount}]] ₽</p></td>
            <td><p th:text="*{printableStatus}"></p></td>
            <td>
                <p th:if="*{paymentLink != null && status == 'AWAIT_PAYMENT'}">
                    <a th:href="*{paymentLink}">Оплатить</a>
                </p>
            </td>
        </tr>
    </table>
    <br/>

</center>

<script th:src="@{/js/app.js}" type="text/javascript"></script>
</body>
</html>
