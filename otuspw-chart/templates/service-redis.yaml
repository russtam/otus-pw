apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis-service
  labels:
    env: {{ .Release.Name }}-redis-service
spec:
  selector:
    env: {{ .Release.Name }}-redis-pw
  ports:
    - protocol: TCP
      name: metrics
      port: 6379
      targetPort: 6379
  type: {{ .Values.service.type | default "ClusterIP" }}
